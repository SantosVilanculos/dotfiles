#!/usr/bin/env bash

# (Github Light High Contrast) Colors for Tmux

set -g mode-style "fg=#ffffff,bg=#0349b4"

set -g message-style "fg=#0e1116,bg=#ffffff"
set -g message-command-style "fg=#0e1116,bg=#ffffff"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#0e1116,bg=#ffffff"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#66707b,bg=#ffffff"
setw -g window-status-current-style "bold,fg=#055d20,bg=#ffffff"
setw -g window-status-activity-style "underscore,fg=#66707b,bg=#ffffff"
