#!/usr/bin/env bash

# (Github Light Tritanopia) Colors for Tmux

set -g mode-style "fg=#ffffff,bg=#0969da"

set -g message-style "fg=#24292f,bg=#ffffff"
set -g message-command-style "fg=#24292f,bg=#ffffff"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#24292f,bg=#ffffff"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#6e7781,bg=#ffffff"
setw -g window-status-current-style "bold,fg=#cf222e,bg=#ffffff"
setw -g window-status-activity-style "underscore,fg=#6e7781,bg=#ffffff"
