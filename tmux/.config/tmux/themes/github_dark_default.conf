#!/usr/bin/env bash

# (Github Dark Default) Colors for Tmux

set -g mode-style "fg=#0d1117,bg=#2f81f7"

set -g message-style "fg=#e6edf3,bg=#0d1117"
set -g message-command-style "fg=#e6edf3,bg=#0d1117"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#e6edf3,bg=#0d1117"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#6e7681,bg=#0d1117"
setw -g window-status-current-style "bold,fg=#3fb950,bg=#0d1117"
setw -g window-status-activity-style "underscore,fg=#6e7681,bg=#0d1117"
