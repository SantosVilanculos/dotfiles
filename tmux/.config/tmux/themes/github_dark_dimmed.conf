#!/usr/bin/env bash

# (Github Dark Dimmed) Colors for Tmux

set -g mode-style "fg=#22272e,bg=#539bf5"

set -g message-style "fg=#adbac7,bg=#22272e"
set -g message-command-style "fg=#adbac7,bg=#22272e"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#adbac7,bg=#22272e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#636e7b,bg=#22272e"
setw -g window-status-current-style "bold,fg=#57ab5a,bg=#22272e"
setw -g window-status-activity-style "underscore,fg=#636e7b,bg=#22272e"
