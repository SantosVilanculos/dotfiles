#!/usr/bin/env bash

# (Github Dark High Contrast) Colors for Tmux

set -g mode-style "fg=#0a0c10,bg=#71b7ff"

set -g message-style "fg=#f0f3f6,bg=#0a0c10"
set -g message-command-style "fg=#f0f3f6,bg=#0a0c10"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#f0f3f6,bg=#0a0c10"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#9ea7b3,bg=#0a0c10"
setw -g window-status-current-style "bold,fg=#26cd4d,bg=#0a0c10"
setw -g window-status-activity-style "underscore,fg=#9ea7b3,bg=#0a0c10"
