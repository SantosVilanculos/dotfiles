php:
    default_version: "8.5"
    xdebug_enabled: {}
    extensions: []
node:
    default_version: "26"
    managed: true
    manager: fnm
nginx:
    http_port: 80
    https_port: 443
dns:
    enabled: true
    tld: test
dumps:
    enabled: true
idle_suspend:
    enabled: true
    timeout: 30m0s
auto_snapshot:
    enabled: true
auto_cleanup: true
parked_directories:
    - /home/santosvilanculos/Lerd
services:
    mailpit:
        enabled: true
        image: docker.io/axllent/mailpit:latest
        port: 1025
        extra_ports: []
        last_op: update
    mariadb-11-8:
        enabled: true
        image: docker.io/library/mariadb:11.8
        port: 3306
        extra_ports: []
        last_op: update
    meilisearch:
        enabled: false
        image: docker.io/getmeili/meilisearch:v1.42.1
        port: 7700
        extra_ports: []
        last_op: update
    mysql:
        enabled: true
        image: ""
        port: 3306
        extra_ports: []
    mysql-9-7:
        enabled: true
        image: docker.io/library/mysql:9.7.2
        port: 3306
        extra_ports: []
        published_port: 3308
    phpmyadmin:
        enabled: true
        image: docker.io/library/phpmyadmin:latest
        port: 8080
        extra_ports: []
        last_op: update
    postgres:
        enabled: true
        image: ""
        port: 5432
        extra_ports: []
    redis:
        enabled: true
        image: docker.io/library/redis:7.4.10-alpine
        port: 6379
        extra_ports: []
        previous_image: docker.io/library/redis:7.4.9-alpine
        last_op: update
    redisinsight:
        enabled: true
        image: docker.io/redis/redisinsight:latest
        port: 8085
        extra_ports: []
        last_op: update
    rustfs:
        enabled: false
        image: docker.io/rustfs/rustfs:latest
        port: 9000
        extra_ports: []
        domain: rustfs.test
        last_op: update
    typesense:
        enabled: false
        image: docker.io/typesense/typesense:30.2
        port: 8108
        extra_ports: []
        last_op: update
    typesense-dashboard:
        enabled: false
        image: docker.io/bfritscher/typesense-dashboard:latest
        port: 8084
        extra_ports: []
        last_op: update
